<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente CSS</title>
    <style>
        /* o simbolo ' * ' é usado para atribuiçoes globais */
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient( to right #fff324, #234f23, #c345a4, #213c33, #acd331)
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
