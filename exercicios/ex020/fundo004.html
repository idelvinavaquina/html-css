<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizacao vertical</title>
    <style>
        #conteiner {
            position: relative;
            height: 500px;
            padding: 10px;
            background-color: purple;
        }

        #conteudo {
            position: absolute;
            height: 200px;
            width: 600px;
            background-color: yellow;

            left: 50%;
            top: 50%
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <main id="conteiner">
        <article id="conteudo">

        </article>
    </main>
</body>
</html>
